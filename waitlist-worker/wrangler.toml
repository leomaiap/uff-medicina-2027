name = "uff-medicina-2027-waitlist"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Origens permitidas no CORS (separadas por vírgula). Atualize caso use domínio próprio.
ALLOWED_ORIGINS = "https://leomaiap.github.io,http://localhost:8080,http://127.0.0.1:8080"
LGPD_CONSENT_VERSION = "v1-2026-11"
# Limites calibrados para redes compartilhadas (ex.: NAT do HUAP / FacMed UFF)
RATE_LIMIT_15M = "5"
RATE_LIMIT_24H = "15"
# Opcional: para validação estrita de JWT do Cloudflare Access no /admin
# CF_ACCESS_TEAM_DOMAIN = "sua-equipe.cloudflareaccess.com"
# CF_ACCESS_AUD = "SEU_AUD_TAG_DO_ACCESS"
# Opcional: restringir domínios de e-mail autorizados no /admin (separados por vírgula)
ADMIN_ALLOWED_DOMAINS = "id.uff.br,uff.br"

[[d1_databases]]
binding = "DB"
database_name = "uff-waitlist-2027"
# Substitua pelo database_id retornado por: npx wrangler d1 create uff-waitlist-2027
database_id = "SUBSTITUA_PELO_ID_DO_D1"

# ============================================================================
# SECRETS (nunca coloque neste arquivo — cadastre via CLI):
#   npx wrangler secret put TURNSTILE_SECRET_KEY
#   npx wrangler secret put IP_HASH_SALT
# ============================================================================
